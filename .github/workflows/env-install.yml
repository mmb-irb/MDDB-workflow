name: Environment install

# Check that envs/environment.yml installs with the python versions the CI workflow does not test
on:
  workflow_dispatch: ~
  push:
    branches: [ master ]
    paths:
      - 'envs/environment.yml'
      - '.github/workflows/env-install.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'envs/environment.yml'
      - '.github/workflows/env-install.yml'

jobs:
  install:
    strategy:
      # Report every python version, not only the first one that fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.11 is already installed and tested by the CI workflow
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      # The environment file pins python, so replace that pin with the matrix version
      - name: Set the python version in the environment file
        run: |
          sed -i -E 's/^(\s*-\s*python)=[0-9.]+\s*$/\1=${{ matrix.python-version }}/' envs/environment.yml
          grep -E '^\s*-\s*python=' envs/environment.yml

      - name: Setup-micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          generate-run-shell: true
          micromamba-version: '2.9.0-0'
          post-cleanup: 'all'
          init-shell: bash
          environment-file: envs/environment.yml
          cache-downloads: true

      - name: List installed package versions
        shell: bash -l {0}
        run: micromamba list

      - name: Check the python version
        shell: bash -l {0}
        run: python -c "import sys; v = '${{ matrix.python-version }}'; assert sys.version.startswith(v + '.'), sys.version; print(sys.version)"

      - name: Install mddb_workflow
        shell: bash -l {0}
        run: python -m pip install -e .

      - name: Import the workflow and its dependencies
        shell: bash -l {0}
        run: |
          python -c "import mddb_workflow.console"
          python -c "import pytraj, MDAnalysis, mdtraj, Bio, gemmi, numba, rdkit, mordred, biotite, xmltodict, pydantic, xxhash, pymongo, plotext, rich, jinja2, yaml"
          mwf --help

      - name: Check the external programs
        shell: bash -l {0}
        run: |
          for program in gmx vmd cmip fpocket chap Cur+; do
            command -v $program || { echo "$program is missing"; exit 1; }
          done
